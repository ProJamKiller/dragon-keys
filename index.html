<script>
  // Global recording variables
  var recordedEvents = [];
  var isRecording = false;

  // Call this to start recording key events
  function startRecording() {
    recordedEvents = []; // Clear any previous events
    isRecording = true;
    console.log("Recording started");
  }

  // Call this to stop recording key events
  function stopRecording() {
    isRecording = false;
    console.log("Recording stopped. Recorded events:", recordedEvents);
    // Optionally, send recordedEvents to your server here.
  }

  // Your dragalong1 function to capture key events and trigger sounds
  function dragalong1(event) {
    // Get event coordinates (works for both mouse and touch)
    var eventX = event.clientX || (event.touches && event.touches[0].pageX);
    var eventY = event.clientY || (event.touches && event.touches[0].pageY);

    // Get the element at these coordinates, then its closest key element
    var ele = document.elementFromPoint(eventX, eventY);
    if (ele) {
      ele = ele.closest(".key_circular_shading");
    }

    if (ele) {
      // Only trigger if this key is not already active (prevents duplicate triggers)
      if (hypeDocument.customData['currentSustain'] !== ele.id) {
        hypeDocument.customData['currentSustain'] = ele.id;

        // Retrieve key info (assumes a data-keyname attribute)
        var theKeyNumber = ele.dataset.keyname;

        // This triggers your Hype sound behavior for the key
        hypeDocument.triggerCustomBehaviorNamed(theKeyNumber);

        // If recording is on, log this event with its details
        if (isRecording) {
          recordedEvents.push({
            keyId: ele.id,
            keyName: theKeyNumber,
            eventType: event.type,
            timestamp: Date.now()
          });
        }
      }
    }
  }
